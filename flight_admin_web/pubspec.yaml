name: flight_admin_web
description: Flight Booking Admin Dashboard

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  shared_preferences: ^2.2.3
  excel: ^4.0.6
  pdf: ^3.11.0
  printing: ^5.13.1
  file_picker: ^8.0.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  spreadsheet_decoder: ^2.3.0
  sqflite: ^2.4.2+1
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/flight_booking_app.png"

  web:
    generate: true
    image_path: "assets/icon/flight_booking_app.png"
    background_color: "#1E3A5F"
    theme_color: "#1E3A5F"