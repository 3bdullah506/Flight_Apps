name: flight_client_app
description: وجهات - تطبيق حجز تذاكر الطيران

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  flutter_native_splash: ^2.4.1
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Flight_Booking_App.jpeg"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#1E3A5F"
  image: assets/icon/splash_image.png
  fullscreen: true
  android: true
  ios: true
